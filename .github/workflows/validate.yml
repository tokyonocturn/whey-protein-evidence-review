name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute cost tables
        run: python analysis/compute_costs.py
      - name: Validate datasets and documentation
        run: python analysis/validate.py
