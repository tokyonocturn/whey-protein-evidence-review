name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute cost tables
        run: python analysis/compute_costs.py
      - name: Validate datasets and documentation
        run: python analysis/validate.py
      - name: Check links, citations and published figures
        run: python analysis/check_docs.py
      - name: Check every citation marker has an audit verdict
        run: python analysis/check_audit.py
      - name: Confirm regeneration leaves the committed tables unchanged
        run: git diff --exit-code -- data/derived_costs.csv data/derived_product_metrics.csv
